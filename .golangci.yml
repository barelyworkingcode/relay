version: "2"

# Tuned for relay. The enabled set below is the aspiration, not the current
# state: a full run reports on the order of a hundred findings, most of them
# errcheck and staticcheck in long-standing code. Until that backlog is
# cleared this is a ratchet to compare against, not a gate — judge a change by
# whether it ADDS a finding, not by whether the run is empty.
# Noisy-but-occasionally-useful
# linters (gosec, gocognit, prealloc) are deliberately absent — run them
# on demand via `golangci-lint run --default=none -E <linter>`, not in the gate.

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - nilerr
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

  settings:
    errcheck:
      # Diagnostic writes to stdout/stderr and best-effort closes in cleanup
      # paths have no recovery action; checking them adds noise, not safety.
      exclude-functions:
        - (*bufio.Writer).Flush
        - (*text/tabwriter.Writer).Flush
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*flag.FlagSet).Parse

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unparam
          - bodyclose
