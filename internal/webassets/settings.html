<!DOCTYPE html>
<html>
<head>
<meta name="color-scheme" content="light dark">
<style>
/* ============================================================================
   Theme tokens. Each token declares a standard CSS system color (or rgba)
   FIRST — resolved by both Blink and WebKit, so the cmd/devui harness stays
   sane in Chrome — then an -apple-system-* override that ONLY WebKit parses.
   In the WKWebView those overrides win, giving true native NSColor semantics
   that track light/dark + the user's accent. `color-scheme: light dark` on
   :root is what makes prefers-color-scheme and the system color keywords
   follow the window's effective appearance. Status colors (ok/danger/warn)
   stay literal — they read on both schemes and are not chrome.
   ============================================================================ */
:root {
    color-scheme: light dark;

    --bg:         Canvas;                                          /* window page */
    --bg:         -apple-system-grouped-background;
    --bg-card:    Canvas;                                          /* raised cards / sections */
    --bg-card:    -apple-system-secondary-grouped-background;
    --bg-field:   Field;                                           /* text inputs */
    --bg-field:   -apple-system-text-background;
    --bg-control: rgba(127,127,127,0.14);                          /* secondary buttons / node heads */
    --bg-control: color-mix(in srgb, CanvasText 9%, transparent);
    --bg-hover:   rgba(127,127,127,0.18);                          /* row hover / sidebar select */
    --bg-hover:   color-mix(in srgb, CanvasText 12%, transparent);

    --text:       CanvasText;
    --text:       -apple-system-label;
    --text-2:     GrayText;                                        /* secondary labels */
    --text-2:     -apple-system-secondary-label;
    --text-3:     GrayText;                                        /* tertiary / hints */
    --text-3:     -apple-system-tertiary-label;

    --border:     rgba(127,127,127,0.30);                          /* input + card borders */
    --border:     -apple-system-separator;
    --hairline:   rgba(127,127,127,0.16);                          /* table row dividers */
    --hairline:   color-mix(in srgb, CanvasText 12%, transparent);

    --accent:     #0a84ff;                                         /* fallback macOS blue */
    --accent:     AccentColor;                                     /* user's accent (Blink + WebKit) */
    --on-accent:  #fff;
    --on-accent:  AccentColorText;

    --ok:         #1f9d57;
    --danger:     #e5484d;
    --warn:       #d98300;

    --font:       -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    --mono:       "SF Mono", ui-monospace, Monaco, monospace;
    --radius:     8px;   /* cards / sections */
    --radius-sm:  6px;   /* controls */
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}
input[type=checkbox], input[type=radio] { accent-color: var(--accent); }
.sidebar {
    width: 200px;
    background: var(--bg);
    border-right: 1px solid var(--border);
    padding: 12px 0;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    height: 100%;
    box-sizing: border-box;
}
.sidebar-items { flex: 1; overflow-y: auto; }
.sidebar-footer {
    flex-shrink: 0;
    padding: 10px 16px 4px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
}
.sidebar-version { font-size: 11px; color: var(--text-3); }
.sidebar-item {
    display: flex;
    align-items: center;
    margin: 1px 8px;
    padding: 7px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
    /* Reset <button> chrome: this is a <button role="tab"> now (keyboard
       access needs a real focusable/activatable element), not a <div>, and
       it must look exactly like the div it replaced. */
    background: none;
    border: none;
    font-family: inherit;
    text-align: left;
    box-sizing: border-box;
}
.sidebar-item:hover { background: var(--bg-hover); }
.sidebar-item.active { background: var(--accent); color: var(--on-accent); }
.sidebar-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.content {
    flex: 1;
    padding: 24px 32px;
    overflow-y: auto;
}
h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 20px; }
h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-2); }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.page-header h2 { margin: 0; }
.page-intro { color: var(--text-2); font-size: 12px; margin-bottom: 16px; }
label {
    display: block;
    margin-top: 12px;
    font-size: 12px;
    color: var(--text-2);
}
input[type="text"],
input[type="password"],
input[type="number"],
input[type="search"],
input[type="url"],
input[type="email"],
select {
    width: 100%;
    padding: 6px 9px;
    margin-top: 4px;
    background: var(--bg-field);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 13px;
    font-family: var(--font);
}
input[type="text"]:focus,
input[type="password"]:focus,
input[type="number"]:focus,
input[type="search"]:focus,
input[type="url"]:focus,
input[type="email"]:focus,
select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(10,132,255,0.28);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
}
/* Native push button: neutral/bezeled by default; .btn-primary is the one
   accent-filled default action per view; .btn-danger is destructive. */
.btn {
    padding: 5px 13px;
    background: var(--bg-control);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: var(--font);
    font-weight: 500;
    cursor: pointer;
}
.btn:hover { background: var(--bg-hover); }
.btn:active { background: var(--bg-hover); background: color-mix(in srgb, var(--text) 18%, transparent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn-primary:hover { background: var(--accent); background: color-mix(in srgb, var(--accent) 88%, black); }
.btn-primary:active { background: var(--accent); background: color-mix(in srgb, var(--accent) 78%, black); }
.btn-sm { padding: 3px 10px; font-size: 12px; }
.btn-danger { background: var(--bg-control); color: var(--danger); border-color: var(--border); }
.btn-danger:hover { background: var(--danger); color: #fff; border-color: transparent; }
.perm-btns { display: flex; gap: 4px; }
.perm-btn {
    padding: 3px 10px;
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-control);
    color: var(--text-2);
    cursor: pointer;
}
.perm-btn:hover { background: var(--bg-hover); color: var(--text); }
.perm-btn.active { background: var(--accent); border-color: transparent; color: var(--on-accent); }
textarea {
    width: 100%;
    padding: 6px 9px;
    margin-top: 4px;
    background: var(--bg-field);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 13px;
    font-family: var(--mono);
    resize: vertical;
    min-height: 60px;
}
textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(10,132,255,0.28);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
}
.mcp-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
}
.mcp-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
}
.mcp-card-name { font-weight: 600; font-size: 13px; }
.mcp-card-cmd { color: var(--text-2); font-size: 11px; font-family: var(--mono); }
.mcp-card-tools { color: var(--text-3); font-size: 11px; margin-top: 2px; }
.mcp-tools-toggle { display: block; background: none; border: none; padding: 0; margin-top: 2px; cursor: pointer; font: inherit; color: var(--text-3); font-size: 11px; text-align: left; }
.mcp-tools-list { margin: 4px 0 4px 16px; padding: 0; font-size: 11px; color: var(--text-2); }
.mono-inline { font-family: var(--mono); font-size: 11px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Generic status pill — Overview tiles, MCP health, host probe facts. Same
   ok/warn/danger/muted vocabulary as .svc-badge and .host-status-dot, kept
   separate because those two are shaped for their own one-off contexts. */
.pill { display: inline-block; padding: 1px 7px; font-size: 10px; font-weight: 600; border-radius: 4px; letter-spacing: 0.2px; white-space: nowrap; }
.pill.ok { color: var(--ok); border: 1px solid var(--ok); }
.pill.warn { color: var(--warn); border: 1px solid var(--warn); }
.pill.danger { color: var(--danger); border: 1px solid var(--danger); }
.pill.muted { color: var(--text-2); border: 1px solid var(--border); }

.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; background: var(--text-3); }
.status-dot.ok { background: var(--ok); }
.status-dot.danger { background: var(--danger); }
.status-dot.muted { background: var(--text-3); }

.btn-link { background: none; border: none; padding: 0; color: var(--accent); font-size: 11px; cursor: pointer; font-family: inherit; }
.btn-link:hover { text-decoration: underline; }

.learn-more { margin: 8px 0 16px; font-size: 12px; color: var(--text-2); }
.learn-more summary { cursor: pointer; color: var(--accent); font-size: 12px; }
.learn-more p { margin: 8px 0 0; }

.ca-fingerprint-row { display: flex; align-items: center; gap: 10px; margin: 4px 0 16px; flex-wrap: wrap; }
.ca-fingerprint-label { font-size: 12px; color: var(--text-2); }
.ca-fingerprint-value { font-family: var(--mono); font-size: 11px; background: var(--bg-control); padding: 3px 8px; border-radius: 4px; word-break: break-all; }

/* Overview tab */
.ov-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
/* min-width tuned so 7 tiles wrap 4-then-3 in the content column's width at
   the window's 900px baseline (900 - 200px sidebar - 2*32px content padding). */
.ov-tile { flex: 1 1 145px; min-width: 145px; text-align: left; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; font-family: inherit; color: var(--text); }
.ov-tile:hover { background: var(--bg-hover); }
.ov-tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ov-tile-label { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
.ov-tile-value { font-size: 14px; font-weight: 600; }
.ov-tile.warn .ov-tile-value { color: var(--warn); }
.ov-tile.danger .ov-tile-value { color: var(--danger); }
.ov-section { margin-bottom: 24px; }
.ov-section h3 { margin-bottom: 8px; }
.ov-attention-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.ov-attention-row:last-child { border-bottom: none; }
.ov-attention-link { margin-left: auto; flex-shrink: 0; }
.ov-recent-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 12px; border-bottom: 1px solid var(--border); }
.ov-recent-row:last-child { border-bottom: none; }
.ov-footer { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-3); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.error-msg { color: var(--danger); font-size: 12px; margin-top: 8px; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state {
    color: var(--text-3);
    font-size: 13px;
    padding: 24px 0;
    text-align: center;
}
.toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    margin-bottom: 8px;
    font-size: 13px;
}
.switch {
    position: relative;
    width: 36px;
    height: 21px;
    flex-shrink: 0;
}
.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}
.switch .slider {
    position: absolute;
    inset: 0;
    background: var(--bg-hover);
    border-radius: 11px;
    cursor: pointer;
    transition: background 0.2s;
}
.switch .slider::before {
    content: '';
    position: absolute;
    width: 17px;
    height: 17px;
    left: 2px;
    bottom: 2px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    transition: transform 0.2s;
}
.switch input:checked + .slider {
    background: var(--accent);
}
.switch-running input:checked + .slider {
    background: var(--ok);
}
.switch input:checked + .slider::before {
    transform: translateX(15px);
}
.switch input:disabled + .slider {
    opacity: 0.4;
    cursor: default;
}
.svc-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
.svc-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.svc-card-title { font-weight: 600; font-size: 13px; color: var(--text); }
.svc-badge { display: inline-block; padding: 1px 6px; font-size: 10px; border-radius: 4px; margin-left: 6px; }
.svc-badge.ok { color: var(--ok); border: 1px solid var(--ok); }
.svc-badge.offline { color: var(--text-2); border: 1px solid var(--border); }
.svc-badge.err { color: var(--danger); border: 1px solid var(--danger); }
.svc-stats { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 12px; color: var(--text); font-size: 13px; }
.svc-stat-label { color: var(--text-2); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.svc-stat-value { font-size: 16px; font-weight: 600; color: var(--text); margin-top: 2px; font-variant-numeric: tabular-nums; }
.svc-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.svc-table th { text-align: left; padding: 6px 8px; color: var(--text-2); font-weight: 500; border-bottom: 1px solid var(--border); }
.svc-table td { padding: 6px 8px; border-bottom: 1px solid var(--hairline); color: var(--text); font-variant-numeric: tabular-nums; }
.svc-table tr.pending td { opacity: 0.4; }
.svc-actions { display: flex; gap: 4px; }
.svc-err { color: var(--danger); font-size: 12px; margin-top: 8px; }
.svc-empty { color: var(--text-3); font-size: 12px; padding: 8px 0; }

/* ---- Service Inspector: manifest-declared resources ---- */
.svc-resource { border: 1px solid var(--border); border-radius: var(--radius-sm); margin-top: 12px; }
.svc-resource-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; cursor: pointer; background: var(--bg-control); border-radius: var(--radius-sm) var(--radius-sm) 0 0; user-select: none; }
.svc-resource-header:hover { background: var(--bg-hover); }
.svc-resource-header.closed { border-radius: var(--radius-sm); }
.svc-resource-title { font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.5px; }
.svc-resource-title .chevron { display: inline-block; width: 10px; margin-right: 6px; transition: transform 0.15s; transform: rotate(-90deg); }
.svc-resource-header.open .svc-resource-title .chevron { transform: rotate(0deg); }
.svc-resource-count { color: var(--text-3); font-size: 11px; font-weight: 400; margin-left: 6px; }
.svc-resource-body { padding: 10px 12px 12px; }
.svc-resource-help { color: var(--text-3); font-size: 11px; margin-bottom: 8px; }
.svc-resource-empty { color: var(--text-3); font-size: 12px; padding: 6px 0; }
.svc-resource-form label { margin-top: 8px; }
.svc-resource-form-actions { margin-top: 14px; display: flex; gap: 8px; }
.svc-resource-error { color: var(--danger); font-size: 12px; margin-top: 8px; }

/* ---- Service config editor (collapsible schema tree) ---- */
.cfg-chevron { display: inline-block; width: 9px; color: var(--text-2); font-size: 9px; transition: transform 0.12s ease; transform: rotate(0deg); flex-shrink: 0; }
.cfg-chevron.open { transform: rotate(90deg); }

/* Section group (object / array / map) */
.cfg-node { margin-top: 6px; }
.cfg-node-head { display: flex; align-items: center; gap: 7px; padding: 7px 10px; background: var(--bg-control); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; user-select: none; }
.cfg-node-head:hover { background: var(--bg-hover); }
.cfg-node-title { font-size: 12px; font-weight: 600; color: var(--text); }
.cfg-node-sub { color: var(--text-3); font-size: 11px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cfg-badge { margin-left: auto; flex-shrink: 0; background: var(--bg-hover); color: var(--text-2); font-size: 10px; font-weight: 600; min-width: 18px; text-align: center; padding: 1px 7px; border-radius: 10px; }
.cfg-node-body { margin: 2px 0 4px 9px; padding: 2px 0 4px 14px; border-left: 1px solid var(--border); }

/* Collection item card */
.cfg-item { margin-top: 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.cfg-item-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--bg-control); }
.cfg-item-head:hover { background: var(--bg-hover); }
.cfg-item-toggle { display: flex; align-items: center; gap: 7px; cursor: pointer; flex: 1; min-width: 0; }
.cfg-item-title { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cfg-item-remove { flex-shrink: 0; }
.cfg-item-body { padding: 6px 12px 12px; }

.cfg-add { margin-top: 10px; }

/* Key/value repeater (e.g. llama-server flags) */
.cfg-kv { margin-top: 10px; }
.cfg-kv-label { font-size: 12px; color: var(--text-2); margin-bottom: 2px; }
.cfg-kv-empty { color: var(--text-3); font-size: 12px; padding: 2px 0 2px; }
.cfg-kv-row { display: flex; gap: 6px; align-items: center; margin-top: 5px; }
.cfg-kv-row input { margin-top: 0; }
.cfg-kv-key { flex: 0 0 36%; font-family: var(--mono); }
.cfg-kv-val { flex: 1; font-family: var(--mono); }
.cfg-kv-del { flex-shrink: 0; padding: 4px 9px; }

.cfg-leaf { margin-top: 10px; }
.cfg-leaf > label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 1px; }
.cfg-leaf input.cfg-bad, .cfg-leaf textarea.cfg-bad { border-color: var(--danger); }
.cfg-actions { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
.cfg-apply-note { color: var(--text-2); font-size: 11px; margin-top: 8px; }

/* ---- Projects tab ---- */
.proj-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
.proj-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.proj-card-name { font-weight: 600; font-size: 13px; color: var(--text); }
.proj-badge-remote { display: inline-block; padding: 1px 6px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; border-radius: 4px; color: var(--accent); border: 1px solid var(--accent); }
/* Host chip on a project card (docs/ssh-hosts.md) — monospace-flavoured, like
   a host's own target string, so it reads as "this is infrastructure" next
   to the project's plain-text name. */
.proj-host-chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; font-size: 10px; font-family: var(--mono); border-radius: 4px; color: var(--text-2); border: 1px solid var(--border); }
/* Host status dot + word, reused on the Hosts tab list and (in a later pass)
   eve's own host chip -- connected green, idle grey-filled, unreachable red,
   unknown a grey OUTLINE so "never probed" doesn't read as "probed and grey". */
.host-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-2); text-transform: capitalize; }
.host-status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--text-3); }
.host-status-dot.connected { background: var(--ok); }
.host-status-dot.idle { background: var(--text-3); }
.host-status-dot.unreachable { background: var(--danger); }
.host-status-dot.unknown { background: transparent; border: 1px solid var(--text-3); }
/* Home|Work labels on a project card: the mode badge for home/work only
   (both is the unmarked default), and one chip per mode it is the default for. */
.proj-mode-badge { display: inline-block; padding: 1px 6px; font-size: 10px; font-weight: 600; border-radius: 4px; color: var(--text-2); border: 1px solid var(--border); }
.proj-default-chip { display: inline-block; padding: 1px 6px; font-size: 10px; font-weight: 600; border-radius: 4px; color: var(--on-accent); background: var(--accent); }
.proj-defaults { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 10px; }
.proj-defaults-row { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 8px 10px; align-items: center; }
.proj-defaults-row label { margin: 0; }
.proj-kind-label { font-size: 13px; color: var(--text); padding: 4px 0; }
.proj-card-path { color: var(--text-2); font-size: 11px; font-family: var(--mono); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-card-meta { color: var(--text-3); font-size: 11px; margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.proj-card-meta span { white-space: nowrap; }
.proj-section { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-top: 12px; }
.proj-section-title { font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.proj-section-help { color: var(--text-3); font-size: 11px; margin-bottom: 8px; }
.proj-mcp-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--hairline); }
.proj-mcp-row:last-child { border-bottom: none; }
.proj-mcp-name { font-size: 12px; color: var(--text); }
.proj-mcp-name.dangling { color: var(--text-2); text-decoration: line-through; }
.proj-tool-picker { padding: 8px 0 8px 16px; border-left: 2px solid var(--border); margin: 4px 0 8px 8px; }
.proj-tool-row { display: flex; align-items: flex-start; gap: 8px; padding: 3px 0; font-size: 12px; color: var(--text); }
.proj-tool-row.stale { color: var(--warn); }
.proj-tool-row input[type=checkbox] { margin-top: 2px; }
.proj-tool-row .desc { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.proj-tool-empty { color: var(--text-3); font-size: 11px; padding: 4px 0; font-style: italic; }
.proj-token-field { display: flex; gap: 6px; align-items: center; }
.proj-token-field input { flex: 1; font-family: var(--mono); font-size: 12px; }
.proj-token-banner { background: var(--bg-control); background: color-mix(in srgb, var(--accent) 14%, var(--bg-card)); border: 1px solid var(--accent); border-radius: var(--radius-sm); padding: 8px 12px; margin-top: 8px; font-size: 12px; color: var(--text); }
.proj-token-banner code { color: var(--text); background: var(--bg-control); padding: 2px 6px; border-radius: 3px; font-family: var(--mono); word-break: break-all; }
.proj-template-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; }
.proj-template-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
/* Sticky so Create/Save/Cancel stay reachable regardless of how tall the form
   above them gets — two scope pickers open at once (each with its own inner
   scroll area, .proj-scope-choices below) can make the form taller than the
   window, at which point a wheel scroll over an open picker moves the picker,
   not the page, and the actions row could not be reached without closing one
   first. Sticky to the bottom of .content's own scrollport fixes it without
   caring how tall the form above gets. The background matches .content so
   text scrolling underneath doesn't show through, and the box-shadow stands
   in for the border-top now that there's real content stacked behind it. */
.proj-form-actions {
    margin-top: 18px;
    /* .content has padding-bottom:24px, so a plain bottom:0 sticks the bar
       24px above the real window edge -- form content keeps scrolling
       visibly underneath it. Pulling the sticky point down by that same
       24px (into .content's own bottom padding) and adding it back as
       padding-bottom here keeps the bar's own box, not a gap, occupying
       that space, so it lands flush with the edge and nothing shows
       beneath it. */
    padding: 14px 0 calc(14px + 24px);
    display: flex;
    gap: 8px;
    position: sticky;
    bottom: -24px;
    background: var(--bg);
    box-shadow: 0 -1px 0 var(--border);
}
/* Effective authority: what a record can actually DO, per MCP. On the list row
   and on an enrolment card, because "MCPs: 1" beside a client that can read
   every mailbox on the machine is the failure ADR-011 exists to fix. */
.proj-authority { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
.proj-auth-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font-size: 11px; }
.proj-auth-mcp { font-family: var(--mono); color: var(--text); }
.proj-auth-mode { display: inline-block; padding: 0 6px; border-radius: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; font-size: 10px; }
.proj-auth-mode.read { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.proj-auth-mode.write { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
/* The second axis, styled as its own pill rather than as a variant of the mode
   pill: they are orthogonal (ADR-011 decision 2c), and one pill with four
   states would read as one question with four answers. */
.proj-auth-external { display: inline-block; padding: 0 6px; border-radius: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; font-size: 10px; }
.proj-auth-external.off { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.proj-auth-external.on { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.proj-auth-tools { color: var(--text-2); font-family: var(--mono); }
.proj-auth-scope { color: var(--text-2); }
.proj-auth-scope.none { color: var(--text-3); font-style: italic; }
/* A grant that cannot be satisfied is not a detail. It reads as a warning here
   and again in the banner, because the client-facing half of this is a silent
   `denied` nobody watching the UI would ever see. */
.proj-auth-missing { color: var(--warn); font-weight: 600; }
/* Issue #41: a scope reaching a filesystem root or a whole home directory is
   not "confined to 1 value". It reads as a finding on the row, not as more
   metadata beside the value it qualifies. */
.proj-auth-unrestricted { color: var(--danger); font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; font-size: 10px; padding: 0 6px; border-radius: 9px; background: color-mix(in srgb, var(--danger) 16%, transparent); }
.proj-auth-none { color: var(--text-3); font-style: italic; font-size: 11px; }
.proj-scope-gap { border: 1px solid var(--warn); border-radius: var(--radius-sm); background: color-mix(in srgb, var(--warn) 10%, transparent); padding: 10px 12px; margin-bottom: 12px; font-size: 12px; color: var(--text); }
.proj-scope-gap ul { margin: 6px 0 0 18px; }
.proj-scope-gap code { font-family: var(--mono); }

/* The per-MCP permission panel: mode, tools, resource scope. */
.proj-perm-panel { padding: 8px 0 10px 16px; border-left: 2px solid var(--accent); margin: 4px 0 10px 8px; display: flex; flex-direction: column; gap: 10px; }
.proj-perm-block { }
.proj-perm-label { font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
.proj-scope-field { margin-top: 8px; }
.proj-scope-field > label { display: block; font-size: 12px; color: var(--text); font-family: var(--mono); margin-bottom: 1px; }
.proj-scope-type { font-family: var(--sans, inherit); font-size: 10px; color: var(--text-3); text-transform: none; letter-spacing: 0; }
.proj-scope-desc { font-size: 11px; color: var(--text-3); margin-bottom: 3px; }
.proj-scope-missing { font-size: 11px; color: var(--warn); margin-top: 2px; }
.proj-scope-unrestricted { font-size: 11px; color: var(--danger); font-weight: 600; margin-top: 3px; border-left: 2px solid var(--danger); padding-left: 6px; }
.proj-scope-field input[readonly] { color: var(--text-2); font-family: var(--mono); }

/* The enumeration picker (ADR-011 decision 6). The summary is outside the
   disclosure on purpose: what is stored is what confines the client, so it is
   never behind a control someone has to open to see. */
.proj-scope-summary { font-size: 12px; font-family: var(--mono); color: var(--text); margin: 2px 0 4px; word-break: break-word; }
.proj-scope-summary .proj-scope-none { font-family: var(--sans, inherit); color: var(--text-3); font-style: italic; }
.proj-scope-choices { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 8px; margin-top: 6px; max-height: 260px; overflow-y: auto; }
.proj-scope-choice { display: flex; align-items: baseline; gap: 6px; font-size: 12px; padding: 2px 0; }
.proj-scope-choice label { font-family: var(--mono); color: var(--text); }
.proj-scope-choice .desc { font-family: var(--sans, inherit); font-size: 11px; color: var(--text-3); }
/* A stored value the MCP no longer offers stays visible and stays SELECTED.
   An account renamed on the host must not quietly widen or narrow a profile by
   vanishing from a form, so it is flagged rather than dropped. */
.proj-scope-choice.unrecognised label { color: var(--warn); }
.proj-scope-unrecognised { font-size: 11px; color: var(--warn); margin: 2px 0; }
.proj-scope-failed { font-size: 11px; color: var(--danger); margin: 4px 0 2px; }
.proj-scope-pending { font-size: 11px; color: var(--text-3); margin: 4px 0 2px; }
/* The project model picker. A saved id the host no longer lists stays checked
   and is flagged, never dropped, for the same reason as .unrecognised above. */
.model-banner { font-size: 11px; margin: 4px 0 6px; }
.model-banner.pending { color: var(--text-3); }
.model-banner.failed { color: var(--danger); }
.model-banner.warn { color: var(--warn); }
.model-banner .btn { margin-left: 6px; }
#projModelsList { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 8px; margin-top: 6px; max-height: 320px; overflow-y: auto; }
.model-group + .model-group { margin-top: 6px; }
.model-group-title { font-size: 11px; font-weight: 600; color: var(--text-2); margin: 2px 0; }
.model-group-toggle { background: none; border: none; padding: 2px 0; font: inherit; font-size: 11px; font-weight: 600; color: var(--text-2); cursor: pointer; }
.model-group-count { font-weight: normal; color: var(--text-3); }
.model-row { display: flex; align-items: baseline; gap: 6px; font-size: 12px; padding: 2px 0; }
.model-label { font-family: var(--mono); color: var(--text); word-break: break-all; }
.model-id { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.model-row.unavailable .model-label { color: var(--warn); }
.model-unavailable { font-size: 11px; color: var(--warn); }
.model-alias-tag { font-size: 10px; color: var(--text-2); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; }
.model-empty { font-size: 11px; color: var(--text-3); font-style: italic; padding: 2px 0; }
.enrol-profile { margin-top: 6px; }

.proj-error { color: var(--danger); font-size: 12px; margin-top: 8px; }
.proj-error[tabindex] { outline: none; } /* focusable so an off-screen refusal can be scrolled/focused to, not so it looks focused */
/* A refusal localized to one field (relay#25) — printed right under it, where
   the fix actually happens, instead of only in the banner above. */
.proj-field-error { color: var(--danger); font-size: 11px; margin-top: 4px; }
input.proj-field-invalid { border-color: var(--danger); }
input.proj-field-invalid:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 28%, transparent); }
.proj-ok { color: var(--ok); font-size: 12px; margin-top: 8px; }

/* ---- Tool Calls (audit log) ---- */
.audit-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.audit-bar input[type="search"], .audit-bar select { margin-top: 0; width: auto; min-width: 120px; }
.audit-bar .grow { flex: 1 1 180px; min-width: 140px; }
.audit-note { font-size: 12px; color: var(--text-2); margin-bottom: 10px; }
.audit-note.warn { color: var(--warn); }
.audit-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
.audit-table th { text-align: left; padding: 6px 8px; color: var(--text-2); font-weight: 500; border-bottom: 1px solid var(--border); }
.audit-table td { padding: 6px 8px; border-bottom: 1px solid var(--hairline); color: var(--text); vertical-align: top; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.audit-table tr.row { cursor: pointer; }
.audit-table tr.row:hover td { background: var(--bg-hover); }
.audit-time, .audit-ms { font-variant-numeric: tabular-nums; color: var(--text-2); }
.audit-tool { font-family: var(--mono); }
.audit-detail { color: var(--text-2); font-family: var(--mono); }
.audit-pill { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 11px; font-weight: 500; white-space: nowrap; }
/* A scope violation is a distinct finding from an ordinary tool_error — a
   client probed a resource boundary and the MCP itself refused it — and it
   has to be visible beside the pill, not only after expanding the row. */
.audit-badge { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 6px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; vertical-align: middle; }
.audit-badge-scope { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
/* The outcome cell must never ellipsize: a clipped pill reads as a rendering
   fault, and "unauthorized" is exactly the row a reader is looking for. */
.audit-table td.audit-outcome-cell { overflow: visible; text-overflow: clip; }
.audit-ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.audit-error { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
.audit-tool_error { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
.audit-denied { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.audit-unauthorized { background: color-mix(in srgb, var(--danger) 26%, transparent); color: var(--danger); }
.audit-throttled { background: color-mix(in srgb, var(--warn) 30%, transparent); color: var(--warn); }
.audit-pending { background: color-mix(in srgb, var(--text-2) 18%, transparent); color: var(--text-2); }
.audit-expand td { background: color-mix(in srgb, CanvasText 5%, transparent); white-space: normal; box-shadow: inset 2px 0 0 var(--accent); }
.audit-kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; font-size: 12px; }
.audit-kv dt { color: var(--text-2); }
.audit-kv dd { margin: 0; font-family: var(--mono); word-break: break-all; }
.audit-args { margin-top: 8px; padding: 8px; background: var(--bg-field); border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--mono); font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 260px; overflow: auto; }
.audit-empty { color: var(--text-2); font-size: 13px; padding: 24px 0; text-align: center; }

/* ---- Remote Clients (enrolments + the mTLS listener) ---- */
.enrol-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
.enrol-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.enrol-card-name { font-weight: 600; font-size: 13px; color: var(--text); }
.enrol-grants { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
.enrol-grant { display: inline-block; padding: 1px 7px; font-size: 11px; border-radius: 9px; background: var(--bg-control); color: var(--text); }
/* A grant whose project no longer exists. Shown, never hidden: an operator
   deciding whether to revoke needs to see that a grant points at nothing. */
.enrol-grant.dangling { color: var(--warn); border: 1px solid var(--warn); }
.enrol-grant.none { color: var(--text-3); background: transparent; border: 1px dashed var(--border); }
.enrol-meta { color: var(--text-3); font-size: 11px; margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
/* The fingerprint prints in FULL — never ellipsized, never width-clipped.
   After an enrolment is deleted it is the only thing that identifies that
   client's calls in the audit log (ADR-010 decision 6), and a UI that
   shortened it would be the obvious place for someone to copy a short form
   from. break-all wraps it instead of truncating it. */
.enrol-fp { font-family: var(--mono); font-size: 11px; color: var(--text-2); margin-top: 6px; word-break: break-all; overflow-wrap: anywhere; white-space: normal; }
.enrol-fp-label { color: var(--text-3); }
.enrol-bundle { background: var(--bg-control); background: color-mix(in srgb, var(--accent) 14%, var(--bg-card)); border: 1px solid var(--accent); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 12px; font-size: 12px; color: var(--text); }
.enrol-bundle code { background: var(--bg-control); padding: 2px 6px; border-radius: 3px; font-family: var(--mono); word-break: break-all; }
.enrol-bundle ul { margin: 6px 0 6px 18px; }
.enrol-bundle li { font-size: 11px; color: var(--text-2); }
.enrol-bundle strong { color: var(--text); }
.remote-state { display: inline-block; padding: 1px 7px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; border-radius: 4px; }
.remote-state.on { color: var(--ok); border: 1px solid var(--ok); }
.remote-state.off { color: var(--text-2); border: 1px solid var(--border); }
.remote-state.absent { color: var(--text-3); border: 1px dashed var(--border); }
/* The comparison code, and the largest thing on a pending row: the operator
   is being asked to read six characters off one screen and match them to six
   on another, and a code rendered at body size is a code nobody compares. */
.enrol-sas { border: 1px solid var(--accent); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; }
.enrol-sas-code { font-family: var(--mono); font-size: 30px; font-weight: 700; letter-spacing: 6px; color: var(--text); }
.enrol-sas-state { font-size: 13px; font-weight: 600; color: var(--text-2); }
.enrol-sas-help { font-size: 11px; color: var(--text-2); margin-top: 4px; }
.enrol-sas.waiting { border-style: dashed; border-color: var(--border); }
.enrol-sas.failed { border-color: var(--danger); }
.enrol-sas.failed .enrol-sas-state { color: var(--danger); }
.enrol-sas.legacy { border-style: dashed; border-color: var(--border); }
.remote-note { font-size: 11px; color: var(--text-2); margin-top: 8px; }
.remote-note.warn { color: var(--warn); }
.remote-note.danger { color: var(--danger); }

/* ---- Passkeys (registrations + the browser sessions they minted) ---- */
.pk-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
.pk-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 12px; }
.pk-card-name { font-weight: 600; font-size: 13px; color: var(--text); }
.pk-meta { color: var(--text-3); font-size: 11px; margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
/* The credential id is shown ABBREVIATED, never whole — the opposite choice
   to .enrol-fp above, and deliberately so. A fingerprint outlives the record
   it names and is the only thing identifying that client's calls afterwards;
   a passkey id names nothing after revocation, so the only thing a full one
   would add on screen is a long random-looking string next to the word
   "credential". Revoke still sends the full id, which never gets rendered. */
.pk-id { font-family: var(--mono); font-size: 11px; color: var(--text-2); }
.pk-counter { color: var(--text-3); font-size: 11px; margin-top: 4px; }
/* The minted bootstrap code. Loud, because it is on screen for two minutes
   and is not recoverable once the window is closed. */
.pk-code-banner { background: var(--bg-control); background: color-mix(in srgb, var(--accent) 14%, var(--bg-card)); border: 1px solid var(--accent); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 12px; font-size: 12px; color: var(--text); }
.pk-code { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: 1px; color: var(--text); word-break: break-all; user-select: all; margin: 8px 0; }
.pk-code-line { font-size: 11px; color: var(--text-2); margin-top: 4px; }
.pk-code-line.warn { color: var(--warn); }
.pk-code-line strong { color: var(--text); }
.pk-session { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 8px; }
.pk-session-name { font-family: var(--mono); font-size: 12px; color: var(--text); word-break: break-all; }
.pk-session-meta { color: var(--text-3); font-size: 11px; margin-top: 3px; }
.pk-pending { color: var(--warn); font-size: 12px; font-weight: 500; }
</style></head>
