name: burn-in

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: burn-in-${{ github.ref }}
  cancel-in-progress: true

# No paths filter and no job-level if: the check exists on every PR, and a PR
# with no added or changed test passes with nothing to run.
jobs:
  burn-in:
    name: burn-in
    # macOS, as ci.yml's race job: go list then evaluates darwin build tags.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go run ./cmd/burnin "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
