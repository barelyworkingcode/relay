name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR makes the older run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    # relay is cgo + Cocoa; there is no Linux build to check.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal web)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go vet (test build)
        run: go vet -tags relaytest ./...
      - name: release binary lacks the test seams
        run: |
          out=$(mktemp -d)
          go build -o "$out/release" ./cmd/relay
          go build -tags relaytest -o "$out/tagged" ./cmd/relay
          scripts/check-test-build.sh absent "$out/release"
          scripts/check-test-build.sh present "$out/tagged"
      - name: no unit tests outside e2e
        run: |
          stray=$(find . -name '*_test.go' -not -path './e2e/*' -not -path './.git/*')
          if [ -n "$stray" ]; then
            echo "_test.go files outside e2e/:"; echo "$stray"; exit 1
          fi

  e2e:
    name: e2e
    # The harness builds the relaytest bundle itself, so this needs cgo + Cocoa.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: gofmt (e2e)
        working-directory: e2e
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet (e2e)
        working-directory: e2e
        run: go vet ./...
      - name: tmux (persistent-session rows)
        run: command -v tmux || brew install tmux
      - name: e2e feature tests
        working-directory: e2e
        run: go test -race -count=1 -timeout 35m ./...
